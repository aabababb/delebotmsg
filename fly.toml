# fly.toml app configuration file generated for delebotmsg on 2026-07-30T08:46:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'delebotmsg'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[processes]
  app = 'python delebotmsg2.py'

[http_service]
  internal_port = 8080
  http_checks = []
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
