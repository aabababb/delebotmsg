# fly.toml app configuration file generated for delebotmsg on 2026-07-30T15:47:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'delebotmsg'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[processes]
  app = 'python delebotmsg2.py'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'off'
  force_https = false
  internal_port = 8080
  min_machines_running = 1
  processes = ['app']
